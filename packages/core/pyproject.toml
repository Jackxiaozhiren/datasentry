[project]
name = "datasentry-core"
version = "0.5.0"
description = "DataSentry AI core domain models and engine (detectors, fusion, scoring, repairs)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["data-quality", "data-observability", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "charset-normalizer>=3.3",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasentry_core"]
