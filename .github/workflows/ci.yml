name: CI

# D6-03: `workflow_call` lets publish.yml gate a release on this exact definition. Reused rather
# than copied so there is no second CI definition to drift away from the first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Explicit least privilege: as a called workflow this file inherits the caller's permissions, and the
# publish workflow needs `id-token: write` for PyPI. Declaring it here keeps the release-prerequisite
# jobs from carrying a token they have no use for.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_VERSION: "3.12"
      # Step 55：真实 PG 集成用例（test_postgres_integration.py）经此 DSN 连 service
      TEST_POSTGRES_DSN: postgresql://testuser:testpass@localhost:5432/testdb
      # Step 56：真实 MySQL 集成用例（test_mysql_integration.py）经此 DSN 连 service
      TEST_MYSQL_DSN: mysql://root:testpass@localhost:3306/testdb
      # Step 57（MinIO 集成）暂摘（D6-07）：匿名拉取 minio/minio 被上游拒绝（CI run
      # 36964587206 实证），digest 钉死后恢复 service、env 与 2b 建桶步骤；
      # test_remote_file_integration.py 自带"连不上即 skip"，pytest 步骤不受影响。
    services:
      postgres:
        # D6-07：digest 钉死（2026-09-25 本地 resolve 验证，见审计报告）。
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        # D6-07：digest 钉死（2026-09-25 本地 resolve 验证，见审计报告）。
        image: mysql:8@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptestpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # D6-07（2026-10-02）：minio service 暂摘——匿名拉取 minio/minio:latest 被上游拒绝
      # （pull denied；postgres/mysql 不受影响）。持 Docker Hub 凭证的维护者 resolve 出
      # 可信 digest 后，把 service（image: minio/minio@sha256:…）、上方 TEST_MINIO_*/AWS_* env
      # 与下方 2b 建桶步骤一并恢复。see: AUDIT/FINDINGS.yaml D6-07
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: 1 · ruff lint
        run: uv run ruff check .

      - name: 2 · ruff format check
        run: uv run ruff format --check .

      - name: 3 · mypy --strict (datasentry_core + datasentry)
        run: uv run mypy packages/core/src/datasentry_core src/datasentry

      - name: 4 · pytest + coverage gate (>=85%)
        run: uv run pytest --cov=datasentry_core --cov-fail-under=85 --cov-report=term --cov-report=xml

      - name: 4b · pip-audit (D5-07 supply-chain gate)
        run: |
          set -e
          uv export --locked --no-dev --no-emit-project --format requirements.txt -o /tmp/ci-req.txt
          grep -v "^-e \|file:///" /tmp/ci-req.txt > /tmp/ci-req-audit.txt
          uv run --with pip-audit pip-audit -r /tmp/ci-req-audit.txt

      - name: 5 · upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: 6 · M9 demo smoke (budget 180s)
        run: uv run python examples/demo/demo.py --rows 2000

      - name: 7 · benchmark (1e6 rows, <=60s gate)
        run: uv run python benchmarks/bench_scan.py 1000000

      - name: 8 · CLI smoke (scan + report + exit code)
        run: |
          set -e
          TMP=$(mktemp -d)
          uv run python - <<'EOF'
          from pathlib import Path
          from datasentry import DataSentry
          import tempfile
          p = Path(tempfile.mkdtemp()) / "d.csv"
          p.write_text("id,name\n1,alice\n2,bob\n")
          c = DataSentry(project=p.parent / "ws")
          try:
              run, _, _ = c.scan_file(p)
              r = c.export_report(run.id)
              assert r["scan"]["fingerprint"]["row_count"] == 2
          finally:
              c.close()
          EOF

      - name: 8b · demo asset guard (record-demo.sh --csv is reproducible + scannable)
        run: |
          set -e
          bash docs/demo/record-demo.sh --csv
          git diff --exit-code -- demo-data/orders.csv >/dev/null || {
            echo "demo-data/orders.csv drifted from the committed deterministic sample"; exit 1; }
          uv run python - <<'EOF'
          from datasentry import DataSentry
          from pathlib import Path
          c = DataSentry(project=Path("demo-data") / "ws-ci")
          try:
              run, _, issues = c.scan_file("demo-data/orders.csv")
              assert run.quality_score is not None
              assert len(issues) >= 5, f"expected >=5 issues in demo data, got {len(issues)}"
              print(f"demo data ok: {len(issues)} issues, score {run.quality_score}")
          finally:
              c.close()
          EOF
          rm -rf demo-data/ws-ci

      - name: 9 · API + UI smoke (container-free)
        run: |
          set -e
          uv run python - <<'EOF'
          from fastapi.testclient import TestClient
          from datasentry.api import create_app
          c = TestClient(create_app())
          assert c.get("/health").json()["ok"] is True
          assert c.get("/ui/").status_code == 200
          print("api+ui smoke ok")
          EOF

      - name: 10 · artifact check (report files exist)
        run: |
          set -e
          TMP=$(mktemp -d)
          uv run python examples/demo/demo.py --rows 500 --out "$TMP" >/dev/null
          test -f "$TMP/report.json"
          test -f "$TMP/report.html"
          test -f "$TMP/customers.csv"
          echo "artifacts ok"

      - name: 11 · wheel build + isolated install smoke (both packages)
        run: |
          set -e
          uv build
          uv build packages/core
          SMOKE=$(mktemp -d)
          uv venv "$SMOKE/venv"
          uv pip install --python "$SMOKE/venv/bin/python" \
            dist/datasentry_ai-*.whl dist/datasentry_core-*.whl
          TMP=$(mktemp -d)
          printf 'name,price\n" alice ",10\nbob,n/a\n' > "$TMP/d.csv"
          "$SMOKE/venv/bin/datasentry" --project "$TMP/ws" scan "$TMP/d.csv" >/dev/null
          "$SMOKE/venv/bin/datasentry" --version

      - name: 12 · MCP Docker stdio introspection smoke
        run: |
          set -euo pipefail
          docker build -f Dockerfile.mcp -t datasentry-mcp:ci .
          RESPONSE=$(
            {
              printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"datasentry-ci","version":"1.0"}}}'
              printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
              printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            } | timeout 30s docker run --rm -i datasentry-mcp:ci
          )
          MCP_RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os

          messages = [
              json.loads(line)
              for line in os.environ["MCP_RESPONSE"].splitlines()
              if line.strip()
          ]
          initialized = next(message for message in messages if message.get("id") == 1)
          tools = next(message for message in messages if message.get("id") == 2)
          assert initialized["result"]["protocolVersion"] == "2024-11-05"
          tool_count = len(tools["result"]["tools"])
          assert tool_count >= 20, f"expected at least 20 MCP tools, got {tool_count}"
          print(f"MCP Docker introspection ok: {tool_count} tools")
          PY
