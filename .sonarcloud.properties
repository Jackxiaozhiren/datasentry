# SonarQube Cloud 自动分析的附加配置（不是 CI 用的 sonar-project.properties）。
#
# `docs/demo/orders-report.html` 是 `scripts/render_demo_report.py` 的**生成物**：
# 内联 CSS/JS 是渲染器的输出，经 `docs/index.html` 的 iframe 作为在线 demo 展示。
# 把它当手写源码扫描会得到 31 条与作者意图无关的结论——CSS 断点重复（层叠需要）、
# 内联 JS 的 `getAttribute`/嵌套三元（生成代码风格）、以及 `<section role="button">`
# 的鼠标事件配对。真正该守的不变量由 `tests/test_reporting_html.py::TestCommittedSample`
# 与 `tests/test_render_demo_report.py` 承担：章节齐全、表格被滚动容器包住、无外链、
# 尺寸预算、源数据不被改动。
#
# 只排除这一份生成物；仓库里的其他 HTML（含 `docs/index.html`）照常参与分析。
sonar.exclusions=docs/demo/orders-report.html
sonar.cpd.exclusions=docs/demo/orders-report.html
