[project]
name = "datasentry-ai"
version = "0.4.0"
description = "An evidence-driven, local-first AI copilot for detecting, explaining, validating, and safely repairing data quality problems."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "DataSentry Contributors" }]
keywords = ["data-quality", "data-observability", "quality-gates", "llm", "duckdb", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "datasentry-core>=0.1.0",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "fastapi-cli>=0.0.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "croniter>=6.2.4",
]

[project.urls]
Homepage = "https://github.com/Jackxiaozhiren/datasentry"
Source = "https://github.com/Jackxiaozhiren/datasentry"
Issues = "https://github.com/Jackxiaozhiren/datasentry/issues"

[project.scripts]
datasentry = "datasentry.cli:main"
datasentry-server = "datasentry.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasentry"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
datasentry-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: 需要外部服务（PostgreSQL 等）的测试",
    "security: 安全测试",
    "benchmark: 性能基准",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/core/src", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF002/RUF003: 文档使用中文全角标点，属有意为之
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# benchmarks 打印中文报告带全角标点，属有意为之
"benchmarks/*" = ["RUF001"]
# demo 脚本帮助文案带中文全角括号，属有意为之
"examples/demo/*" = ["RUF001"]
# UI 模板含 × 排版字符（行×列），属有意为之
"src/datasentry/ui.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["datasentry_core", "datasentry"]
exclude = ["tests"]
# pyarrow 官方无类型存根；以 Any 处理其 API（后续由我们的薄封装提供类型边界）
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# openpyxl 无类型存根
[[tool.mypy.overrides]]
module = ["openpyxl"]
ignore_missing_imports = true

# pyyaml 无类型存根
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
