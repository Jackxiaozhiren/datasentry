[project]
name = "datasentry-core"
version = "0.1.0"
description = "DataSentry AI core domain models and engine (detectors, fusion, scoring, repairs)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "charset-normalizer>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasentry_core"]
