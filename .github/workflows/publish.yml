name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build + verify + publish wheels to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release versions before building
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          # GitHub OIDC namespace authorization is case-sensitive in the Registry.
          MCP_SERVER_NAME = "io.github.Jackxiaozhiren/datasentry"

          def project(path: str) -> dict[str, object]:
              with Path(path).open("rb") as fh:
                  data = tomllib.load(fh)
              value = data["project"]
              assert isinstance(value, dict)
              return value

          def compatible_upper_bound(version: str) -> str:
              major, minor, _patch = (int(part) for part in version.split(".", maxsplit=2))
              if major == 0:
                  return f"0.{minor + 1}.0"
              return f"{major + 1}.0.0"

          app = project("pyproject.toml")
          core = project("packages/core/pyproject.toml")
          app_version = str(app["version"])
          core_version = str(core["version"])
          dependencies = app["dependencies"]
          assert isinstance(dependencies, list)
          upper = compatible_upper_bound(core_version)
          expected_core = f"datasentry-core>={core_version},<{upper}"
          if expected_core not in dependencies:
              raise SystemExit(
                  f"release metadata mismatch: expected dependency {expected_core!r}"
              )

          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          if server.get("name") != MCP_SERVER_NAME:
              raise SystemExit("MCP Registry name does not match the canonical DataSentry name")
          if server.get("version") != app_version:
              raise SystemExit(
                  f"MCP Registry version mismatch: {server.get('version')!r} != {app_version!r}"
              )
          packages = server.get("packages")
          if not isinstance(packages, list) or len(packages) != 1:
              raise SystemExit("MCP Registry metadata must contain exactly one package")
          package = packages[0]
          if package.get("identifier") != "datasentry-ai" or package.get("version") != app_version:
              raise SystemExit("MCP Registry PyPI package metadata does not match datasentry-ai")
          marker = f"<!-- mcp-name: {MCP_SERVER_NAME} -->"
          if marker not in Path("README.md").read_text(encoding="utf-8"):
              raise SystemExit("README is missing the MCP Registry PyPI ownership marker")

          expected_tag = f"v{app_version}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"tag/version mismatch: tag={os.environ['RELEASE_TAG']!r}, "
                  f"expected={expected_tag!r}"
              )

          for package_name, version in (
              ("datasentry-ai", app_version),
              ("datasentry-core", core_version),
          ):
              url = f"https://pypi.org/pypi/{package_name}/{version}/json"
              request = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json", "User-Agent": "datasentry-release-check"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print(f"available on PyPI: {package_name}=={version}")
                      continue
                  raise
              raise SystemExit(
                  f"refusing release: PyPI already contains {package_name}=={version}; bump the version"
              )
          PY

      - name: Build both packages
        run: |
          rm -rf dist
          uv build
          uv build packages/core
          ls -la dist/

      - name: Smoke-test the exact release wheels together
        run: |
          python -m venv /tmp/datasentry-release-smoke
          /tmp/datasentry-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/datasentry-release-smoke/bin/python -m pip install \
            dist/datasentry_core-*.whl \
            dist/datasentry_ai-*.whl

          app_version=$(/tmp/datasentry-release-smoke/bin/python -c 'from importlib.metadata import version; print(version("datasentry-ai"))')
          cli_version=$(/tmp/datasentry-release-smoke/bin/datasentry --version)
          test "$cli_version" = "datasentry $app_version"

          /tmp/datasentry-release-smoke/bin/python - <<'PY'
          from importlib.metadata import version

          from datasentry import DataSentry, __version__ as app_runtime_version
          from datasentry_core import __version__ as core_runtime_version
          from datasentry_core.models.repair import RepairVerifyReport

          assert DataSentry is not None
          assert RepairVerifyReport is not None
          assert app_runtime_version == version("datasentry-ai")
          assert core_runtime_version == version("datasentry-core")
          print("release wheel version/import smoke: PASS")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-mcp-registry:
    name: Publish MCP metadata to official Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          archive=/tmp/mcp-publisher.tar.gz
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            -o "$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /tmp mcp-publisher
          sudo install -m 0755 /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --help >/dev/null

      - name: Authenticate to official MCP Registry with GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish MCP Registry metadata
        run: |
          for attempt in 1 2 3 4 5; do
            set +e
            output=$(mcp-publisher publish server.json 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            # Authentication/authorization, conflict, and schema/validation failures
            # are permanent for this release payload. Retrying them only hides the cause.
            if printf '%s\n' "$output" | grep -Eq 'server returned status (400|401|403|409|422)'; then
              echo "MCP Registry publish failed with a non-retryable Registry error" >&2
              exit "$status"
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "MCP Registry publish failed after transient/PyPI propagation retries" >&2
              exit "$status"
            fi
            sleep $((attempt * 10))
          done
