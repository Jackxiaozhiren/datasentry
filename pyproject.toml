[project]
name = "datasentry-ai"
version = "1.0.2"
description = "Find, explain, and safely fix bad data with local-first detection, evidence-backed issues, and reversible repairs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "DataSentry Contributors" }]
keywords = ["data-quality", "data-cleaning", "data-observability", "quality-gates", "mcp", "duckdb", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "datasentry-core>=0.8.1,<0.9.0",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "fastapi-cli>=0.0.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "croniter>=6.2.4",
    "textual>=6.0",
]

[project.urls]
Homepage = "https://github.com/Jackxiaozhiren/datasentry"
Documentation = "https://jackxiaozhiren.github.io/datasentry/"
Source = "https://github.com/Jackxiaozhiren/datasentry"
Issues = "https://github.com/Jackxiaozhiren/datasentry/issues"
Changelog = "https://github.com/Jackxiaozhiren/datasentry/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/Jackxiaozhiren/datasentry/blob/main/ROADMAP.md"

[project.scripts]
datasentry = "datasentry.entrypoint:main"
datasentry-demo = "datasentry.demo:main"
datasentry-server = "datasentry.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasentry"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "httpx>=0.27",
    # starlette.testclient 自 1.3 起优先使用 httpx2（pydantic 维护的 httpx 后继），
    # 未安装时回退 httpx 并发出 StarletteDeprecationWarning；dev 安装 httpx2 即消除
    "httpx2>=2.0",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
datasentry-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: 需要外部服务（PostgreSQL 等）的测试",
    "security: 安全测试",
    "benchmark: 性能基准",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/core/src", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF002/RUF003: 文档使用中文全角标点，属有意为之
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# 翻译断言含中文全角标点，属有意为之（ADR-075）
"tests/test_reporting_translate.py" = ["RUF001"]
# benchmarks 打印中文报告带全角标点，属有意为之
"benchmarks/*" = ["RUF001"]
# demo 脚本帮助文案带中文全角括号，属有意为之
"examples/demo/*" = ["RUF001"]
# UI 模板含 × 排版字符（行×列），属有意为之
"src/datasentry/ui.py" = ["RUF001"]
# i18n 翻译字典含中文全角标点，属有意为之（ADR-069）
"packages/core/src/datasentry_core/reporting/i18n.py" = ["RUF001", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["datasentry_core", "datasentry"]
exclude = ["tests"]
# pyarrow 官方无类型存根；以 Any 处理其 API（后续由我们的薄封装提供类型边界）
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# openpyxl 无类型存根
[[tool.mypy.overrides]]
module = ["openpyxl"]
ignore_missing_imports = true

# pyyaml 无类型存根
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
